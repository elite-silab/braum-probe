name: Agent Release

on:
  push:
    tags:
      - 'agent-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Agent 版本号（例如 agent-v0.1.1）'
        required: true
        default: 'agent-v0.1.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.mod
      - name: Test
        run: go test ./...
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#agent-v}"
          go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "braum-agent_linux_${GOARCH}" ./cmd/braum-agent
          sha256sum "braum-agent_linux_${GOARCH}" > "braum-agent_linux_${GOARCH}.sha256"
      - uses: actions/upload-artifact@v5
        with:
          name: agent-linux-${{ matrix.arch }}
          path: |
            apps/agent/braum-agent_linux_${{ matrix.arch }}
            apps/agent/braum-agent_linux_${{ matrix.arch }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: agent-linux-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: Braum Agent ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          make_latest: false
          generate_release_notes: true
          files: dist/*
