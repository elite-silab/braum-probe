# ===========================================
# Braum 布隆 CF 探针 — Workers 配置
# ===========================================

name = "braum-worker"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# ===========================================
# 默认/生产环境
# ===========================================

[vars]
APP_VERSION = "0.1.0"
CORS_ORIGINS = "https://braum-web.codeelite.workers.dev"
AGENT_API_URL = "https://braum-worker.codeelite.workers.dev"
AGENT_RELEASE_BASE_URL = "https://github.com/elite-silab/braum-probe/releases/latest/download"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "braum-production"
database_id = "e29b2f97-aab9-4b97-976c-469076528cf9"
migrations_dir = "migrations"

# KV 命名空间绑定
[[kv_namespaces]]
binding = "CACHE"
id = "f0557966b8904cbba7c1fa32817df690"

# Cron 触发器
[triggers]
crons = [
  "*/2 * * * *",   # 每 2 分钟：告警状态评估
  "* * * * *",     # 每分钟：检查 VPS Agent 心跳（探测由 Agent 执行）
  "0 * * * *",     # 每小时整点：小时聚合
  "0 2 * * *",     # 每天凌晨 2 点：日聚合
  "0 3 * * *",     # 每天凌晨 3 点：过期数据清理
]
