# ===========================================
# Braum 布隆 CF 探针 — Workers 配置
# ===========================================

name = "braum-worker"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# ===========================================
# Production 环境
# ===========================================

[vars]
APP_VERSION = "0.1.0"
CORS_ORIGINS = "http://localhost:4321,https://replace-with-pages-domain.example.com"
AGENT_API_URL = "https://api.replace-with-your-domain.example.com"
AGENT_RELEASE_BASE_URL = "https://github.com/elite-silab/braum-probe/releases/latest/download"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "braum-production"
database_id = "<replace-with-production-d1-id>"
migrations_dir = "migrations"

# KV 命名空间绑定
[[kv_namespaces]]
binding = "CACHE"
id = "<replace-with-production-kv-id>"

# Cron 触发器
[triggers]
crons = [
  "*/2 * * * *",   # 每 2 分钟：告警状态评估
  "* * * * *",     # 每分钟：检查 VPS Agent 心跳（探测由 Agent 执行）
  "0 * * * *",     # 每小时整点：小时聚合
  "0 2 * * *",     # 每天凌晨 2 点：日聚合
  "0 3 * * *",     # 每天凌晨 3 点：过期数据清理
]

# ===========================================
# Staging 环境
# ===========================================

[env.staging]
name = "braum-worker-staging"

[env.staging.vars]
APP_VERSION = "0.1.0"
CORS_ORIGINS = "https://replace-with-staging-pages-domain.example.com"
AGENT_API_URL = "https://api-staging.replace-with-your-domain.example.com"
AGENT_RELEASE_BASE_URL = "https://github.com/elite-silab/braum-probe/releases/latest/download"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "braum-staging"
database_id = "<replace-with-staging-d1-id>"
migrations_dir = "migrations"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "<replace-with-staging-kv-id>"

[env.staging.triggers]
crons = [
  "*/2 * * * *",
  "* * * * *",
  "0 * * * *",
  "0 2 * * *",
  "0 3 * * *",
]
