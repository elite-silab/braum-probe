<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <!-- Braum Logo — 布隆探针 -->
  <!-- Shield + Probe Eye Icon -->
  <g>
    <!-- Shield body -->
    <path d="M32 6L8 16v16c0 14.4 10.24 27.84 24 32 13.76-4.16 24-17.6 24-32V16L32 6z" fill="url(#shield-grad)" opacity="0.9"/>
    <!-- Inner ring -->
    <circle cx="32" cy="32" r="12" fill="none" stroke="white" stroke-width="2.5" opacity="0.9"/>
    <!-- Probe dot (the eye) -->
    <circle cx="32" cy="32" r="5" fill="white"/>
    <!-- Signal arcs -->
    <path d="M18 22a18 18 0 0 1 28 0" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M46 42a18 18 0 0 1-28 0" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <defs>
      <linearGradient id="shield-grad" x1="8" y1="6" x2="56" y2="54" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#60a5fa"/>
        <stop offset="100%" stop-color="#3b82f6"/>
      </linearGradient>
    </defs>
  </g>
  <!-- Wordmark -->
  <g fill="#1e293b">
    <text x="72" y="40" font-family="'SF Pro Display', 'Inter', system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">Braum</text>
  </g>
</svg>
